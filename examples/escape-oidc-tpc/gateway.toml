[grpc]
address = "0.0.0.0:19000"

# services to enable
[grpc.services.gateway]
commit_share_to_storage_grant = true
commit_share_to_storage_ref = true

[grpc.services.storageregistry]
[grpc.services.storageregistry.drivers.static]
home_provider = "/home"
[grpc.services.storageregistry.drivers.static.rules]
"/home" = {"address" = "localhost:17000"}
"/reva" = {"address" = "localhost:18000"}
"123e4567-e89b-12d3-a456-426655440000" = {"address" = "localhost:18000"}

[grpc.services.authregistry]
[grpc.services.authregistry.drivers.static.rules]
basic = "localhost:19000"

[grpc.services.authprovider]
[grpc.services.authprovider.auth_managers.json]
users = "users.demo.json"

[grpc.services.userprovider.drivers.json]
users = "users.demo.json"

[grpc.services.authprovider.auth_managers.oidc_escape]
mapping = "external-users-mapping.demo.json"

[grpc.services.groupprovider]
[grpc.services.publicshareprovider]

[http]
address = "0.0.0.0:19001"

[http.services.datagateway]
[http.services.prometheus]
[http.services.ocmd]
[http.services.ocs]
[http.services.ocdav]
enable_http_tpc = true

